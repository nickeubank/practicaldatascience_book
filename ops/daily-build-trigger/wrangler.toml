name = "pds-daily-build-trigger"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Two attempts, both comfortably inside the safe window.
#
# Cloudflare cron expressions are UTC and, like GitHub's, do not follow US
# daylight saving -- but unlike GitHub's they actually fire on time, which is
# the entire reason this Worker exists. That makes the window below
# expressible; it has to satisfy two bounds at once, in both halves of the
# year:
#
#   lower  the build must start after midnight in Durham, or
#          _ext/schedule_tables.py resolves yesterday's campus date and
#          publishes the wrong day's exercises.
#          midnight EST = 05:00 UTC   (the binding case)
#          midnight EDT = 04:00 UTC
#
#   upper  the build must finish before 7:30am ET, or its push to docs/ starts
#          colliding with hand edits.
#          7:30am EDT = 11:30 UTC     (the binding case)
#          7:30am EST = 12:30 UTC
#
# So 05:00-11:30 UTC is safe year-round, and both slots sit well inside it:
# the later one is 3:10am EDT / 2:10am EST, and a build takes about six
# minutes, so even it finishes more than four hours before the cutoff.
#
# Two hours apart rather than back to back, so the second is a real retry --
# long enough for a transient GitHub or network failure to have cleared,
# while still landing in the small hours.
#
# This uses 2 of the 5 Cron Triggers that Cloudflare's free plan allows per
# ACCOUNT (not per Worker), leaving 3 for other projects.
[triggers]
crons = [
  "10 5 * * *",
  "10 7 * * *",
]
